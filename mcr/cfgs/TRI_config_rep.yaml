defaults:
  - _self_
  - override hydra/launcher:  local
  - override hydra/output:  local


# snapshot
save_snapshot: false
load_snap: ""
# replay buffer
num_workers: 16
batch_size: 32
train_steps: 2000000
eval_freq: 20000
# misc
seed: 1
device: cuda
# experiment
experiment: "epic_masked_bc_dinov2"
# agent
lr: 1e-4
# data
dataset: "epic"
use_wandb: true
wandbproject: "masquerade-pretrain"
wandbuser: "maxshen"
doaug: "resize"
datapath: ""

agent:
  _target_: mcr.models.TRI_visual_encoder.VisualEncoder
  device: ${device}
  lr: ${lr}
  model_name: "dinov2_base"
  l2dist: true
  bc_weight: 1.0
  l2weight: 0.0
  l1weight: 0.0
  pretrained: false
  use_film_cond: true
  layernorm_finetune: false
